# MEDISYNC - application.properties

spring.application.name=medisync-backend

# Database Configuration (Placeholders - do not commit real passwords)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medisync}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Server Configuration
server.port=8080

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.medisync=DEBUG
