# MEDISYNC - application.properties

spring.application.name=medisync-backend

# Database Configuration (Placeholders - do not commit real passwords)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medisync}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Initialize missing tables when a fresh database is attached.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Server Configuration
server.port=${PORT:8080}

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.medisync=DEBUG
