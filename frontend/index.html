<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDISYNC - Welcome</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        /* Animated Background */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #0056b3, #00a8cc, #e9ecef, #ffffff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: var(--font-family);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .glass-card.pharmacist-mode {
            background: rgba(240, 253, 244, 0.95);
            border: 2px solid #28a745;
        }

        .welcome-text {
            font-size: 1.2rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
            animation: fadeInDown 1s ease;
        }

        .brand-name {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
            animation: fadeInUp 1s ease;
        }

        .pharmacist-mode .brand-name {
            color: #28a745;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Form Elements */
        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }
        .form-group label {
            font-size: 0.9rem;
            color: var(--text-dark);
            margin-bottom: 0.3rem;
        }
        .form-group input {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #ddd;
        }
        
        .btn-login {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 1rem;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,86,179,0.3);
        }

        .pharmacist-mode .btn-login {
            background: #28a745;
        }
        .pharmacist-mode .btn-login:hover {
            box-shadow: 0 5px 15px rgba(40,167,69,0.3);
        }

        /* Bottom Right Pharmacist Button */
        .floating-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--white);
            color: var(--text-dark);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 2px solid #ddd;
        }
        .floating-btn:hover {
            transform: scale(1.05);
            border-color: #28a745;
            color: #28a745;
        }
        .icon {
            font-size: 1.5rem;
        }

        #portal-title {
            font-weight: bold;
            color: var(--text-light);
            margin-bottom: 1.5rem;
            display: block;
        }

        .register-link {
            font-size: 0.9rem;
            color: var(--text-light);
        }
        .register-link a {
            color: var(--primary-color);
            font-weight: bold;
        }
        .pharmacist-mode .register-link {
            display: none; /* Hide registration on pharmacist view */
        }
    </style>
</head>
<body>

    <!-- Main Login Card -->
    <div class="glass-card" id="loginCard">
        <div class="welcome-text">Welcome to</div>
        <div class="brand-name">MEDISYNC</div>
        
        <span id="portal-title">Patient Portal</span>

        <div id="login-alert" class="alert"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            
            <button type="submit" class="btn-login" id="loginBtnText">Sign In</button>
        </form>

        <div class="register-link">
            New here? <a href="register.html">Create an account</a>
        </div>
    </div>

    <!-- Floating Pharmacist Toggle -->
    <div class="floating-btn" id="pharmacistToggle">
        <span class="icon">⚕️</span>
        <span id="toggleText">Pharmacist Login</span>
    </div>

    <script src="js/api.js?v=2"></script>
    <script>
        // Toggle UI Logic
        const toggleBtn = document.getElementById('pharmacistToggle');
        const loginCard = document.getElementById('loginCard');
        const portalTitle = document.getElementById('portal-title');
        const toggleText = document.getElementById('toggleText');
        
        let isPharmacistMode = false;

        toggleBtn.addEventListener('click', () => {
            isPharmacistMode = !isPharmacistMode;
            
            if (isPharmacistMode) {
                loginCard.classList.add('pharmacist-mode');
                portalTitle.textContent = "Pharmacist Portal";
                toggleText.textContent = "Back to Patient Login";
            } else {
                loginCard.classList.remove('pharmacist-mode');
                portalTitle.textContent = "Patient Portal";
                toggleText.textContent = "Pharmacist Login";
            }
        });

        // Login Submission Logic (using our existing API backend)
        const loginForm = document.getElementById('login-form');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('login-alert');
            alertBox.style.display = 'none';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const submitBtn = document.getElementById('loginBtnText');
            const origText = submitBtn.innerText;
            submitBtn.innerText = 'Authenticating...';
            submitBtn.disabled = true;

            const res = await fetchApi('/auth/login', {
                method: 'POST',
                body: JSON.stringify({ email, password, rememberMe: false })
            });

            submitBtn.innerText = origText;
            submitBtn.disabled = false;

            if (res && res.success) {
                // Determine redirect based on actual backend role
                const role = res.data.role;
                if (role === 'PHARMACIST') {
                    window.location.href = '/pharmacist/dashboard.html';
                } else {
                    window.location.href = '/patient/dashboard.html';
                }
            } else {
                alertBox.textContent = res ? res.message : 'Login failed. Please try again.';
                alertBox.className = 'alert error';
            }
        });

        // Auto-redirect if already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            const res = await fetchApi('/auth/me');
            if (res && res.success) {
                const role = res.data.role;
                if (role === 'PHARMACIST') {
                    window.location.href = '/pharmacist/dashboard.html';
                } else {
                    window.location.href = '/patient/dashboard.html';
                }
            }
        });
    </script>
</body>
</html>
