<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDISYNC - Welcome</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        .hero {
            background-color: var(--white);
            text-align: center;
            padding: 4rem 2rem;
            margin-top: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .hero h1 {
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }
        .hero p {
            font-size: 1.2rem;
            color: var(--text-light);
            margin-bottom: 2rem;
        }
        .hero-buttons .btn {
            margin: 0 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 1.1rem;
        }
        .btn-outline {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }
        .btn-outline:hover {
            background-color: var(--primary-color);
            color: var(--white);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">MEDISYNC</div>
            <div class="nav-links">
                <a href="login.html">Login</a>
                <a href="register.html" class="btn btn-primary" style="color: white; margin-left: 1rem;">Register</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="hero">
            <h1>Welcome to MEDISYNC</h1>
            <p>Your complete medicine reminder and pharmacy management solution.</p>
            <div class="hero-buttons">
                <a href="login.html" class="btn btn-primary">Sign In</a>
                <a href="register.html" class="btn btn-outline">Create an Account</a>
            </div>
        </div>
    </div>

    <!-- Check if already logged in and redirect -->
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const res = await fetchApi('/auth/me');
            if (res && res.success) {
                // User is already logged in, redirect to appropriate dashboard
                const role = res.data.role;
                if (role === 'PHARMACIST') {
                    window.location.href = '/pharmacist/dashboard.html';
                } else {
                    window.location.href = '/patient/dashboard.html';
                }
            }
        });
    </script>
</body>
</html>
